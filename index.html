<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot team board</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Ccircle cx='12' cy='15' r='2.5' fill='white'/%3E%3Ccircle cx='20' cy='15' r='2.5' fill='white'/%3E%3C/svg%3E">
<style>

:root{--bg:#f4f5f8;--card:#fff;--text:#172033;--muted:#5e6a80;--faint:#98a2b3;--line:#e3e6ec}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text);background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
svg{display:block}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.av{position:relative;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font-weight:750;font-size:11.5px;letter-spacing:.02em;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 70%,#000))}
.av .av-ic{width:18px;height:18px}
.av .sd{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--s);border:2.5px solid var(--card,#fff)}
.av .sd.s-planned{background:var(--card,#fff);border:2px dashed #94a3b8;width:11px;height:11px}
.av .sd.s-working:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--s);opacity:0;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.4);opacity:0}}
.av-lg{width:56px;height:56px;border-radius:16px;font-size:18px}
.av-lg .av-ic{width:28px;height:28px}
.av-lg .sd{width:16px;height:16px;border-width:3px}
.own{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 2px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);background:color-mix(in srgb,var(--o) 10%,transparent);white-space:nowrap}
.own b{width:18px;height:18px;border-radius:50%;background:var(--o);color:#fff;font-size:10px;display:grid;place-items:center}
.own.sm{padding:0 2px;background:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:650;color:color-mix(in srgb,var(--s) 75%,#000);background:color-mix(in srgb,var(--s) 13%,transparent)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--s)}
.mock{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;white-space:nowrap}
.mock:before{content:"";width:7px;height:7px;border-radius:50%;background:#f59e0b}
/* drawer */
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;background:#fff;box-shadow:-24px 0 60px -20px rgba(15,23,42,.35);transform:translateX(calc(100% + 90px));transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:90;overflow:auto;--card:#fff}
body.dr-open .drawer{transform:none}
body.dr-open #overlay{opacity:1;pointer-events:auto}
.dr-top{position:relative;padding:28px 24px 22px;display:flex;gap:16px;align-items:flex-start;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,#fff),#fff 75%);border-bottom:1px solid rgba(15,23,42,.07)}
.dr-x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#64748b}
.dr-x:hover{background:rgba(15,23,42,.06);color:#0f172a}
.dr-id{min-width:0;padding-right:28px}
.dr-dept{font-size:11.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.dr-id h2{margin:2px 0 4px;font-size:20px;letter-spacing:-.02em;line-height:1.2;color:#0f172a}
.dr-id p{margin:0;color:#5b6578;font-size:13.5px}
.dr-body{padding:20px 24px 28px;display:flex;flex-direction:column;gap:18px;color:#0f172a}
.dr-row{display:flex;align-items:center;justify-content:space-between}
.dr-upd{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:#64748b}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:6px}
.lbl2{font-size:12px;color:#64748b}
.dr-task{padding:16px;border-radius:14px;background:#f6f7fb;border:1px solid rgba(15,23,42,.06)}
.dr-task b{display:block;font-size:15.5px;margin-bottom:10px}
.dr-task b:last-child{margin:0}
.bar{height:6px;border-radius:9px;background:rgba(15,23,42,.08);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#22c55e,#10b981)}
.dr-kv{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dr-kv .wide{grid-column:1/-1}
.dr-kv .v{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.dr-log{list-style:none;margin:-4px 0 0;padding:0;position:relative}
.dr-log:before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:#e5e8ef}
.dr-log li{position:relative;display:flex;gap:14px;align-items:flex-start;padding:8px 0}
.dr-log li>i{width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid #cbd2de;margin-top:4px;flex:none;position:relative}
.dr-log li:first-child>i{border-color:#22c55e}
.dr-log div{flex:1;min-width:0}
.dr-log b{display:block;font-size:13.5px}
.dr-log span{font-size:12.5px;color:#64748b}
.dr-log time{font-size:12px;color:#94a3b8;white-space:nowrap}
.dr-note{margin:0;font-size:12px;color:#b45309;text-align:center}

.nav{height:52px;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;gap:18px;padding:0 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.01em}
.logo span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#38bdf8,#8b5cf6 60%,#ec4899)}
.logo span .ico{color:#fff;width:17px;height:17px}
.nav nav{display:flex;gap:4px;margin-left:14px}
.nav nav a{padding:6px 12px;border-radius:8px;font-size:13.5px;color:#94a3b8;font-weight:550}
.nav nav a.on{color:#fff;background:rgba(255,255,255,.08)}
.nav .sp{flex:1}
.fds{display:flex}
.fds b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;border:2px solid #0f172a;margin-left:-6px}
.head{padding:20px 28px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.crumb{font-size:12.5px;color:var(--faint);font-weight:550}
.crumb b{color:var(--muted);font-weight:600}
h1{margin:4px 0 0;font-size:26px;letter-spacing:-.025em;display:flex;align-items:center;gap:12px}
.chief{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:14px;background:linear-gradient(120deg,#0f172a,#312e81 60%,#6d28d9);color:#fff;box-shadow:0 10px 26px -14px rgba(79,70,229,.8);--card:#1e1b4b}
.chief .av{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.chief small{display:block;font-size:11px;opacity:.7;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chief b{font-size:14px}
.chief em{font-style:normal;font-size:12.5px;opacity:.8;margin-left:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.2)}
.chief:hover{filter:brightness(1.1)}
.bar-f{position:sticky;top:0;z-index:40;margin-top:16px;padding:10px 28px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.srch{display:flex;align-items:center;gap:8px;height:34px;width:230px;padding:0 10px;border-radius:9px;background:#fff;border:1px solid var(--line);color:var(--faint);transition:border-color .2s,box-shadow .2s}
.srch:focus-within{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.srch input{border:0;outline:0;flex:1;min-width:0;background:none;font-size:13.5px;color:var(--text)}
.ownf{display:flex;padding-left:6px}
.ownf button{width:32px;height:32px;border-radius:50%;margin-left:-6px;border:2px solid var(--bg);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background:var(--o);transition:transform .15s,box-shadow .15s}
.ownf button:hover{transform:translateY(-2px);z-index:2}
.ownf button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--o);z-index:3}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.dchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);transition:all .15s;white-space:nowrap}
.dchip i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.dchip:hover{border-color:var(--faint);color:var(--text)}
.dchip.on{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:color-mix(in srgb,var(--c) 55%,#fff);color:color-mix(in srgb,var(--c) 70%,#000)}
.bar-f .sp{flex:1}
.ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.ghost:hover{background:rgba(15,23,42,.05);color:var(--text)}
.board{padding:14px 28px 40px}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.colh{position:sticky;top:55px;z-index:30;background:var(--bg);padding:6px 0 10px}
.colh>div{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);box-shadow:inset 0 3px 0 var(--s)}
.colh i{width:8px;height:8px;border-radius:50%;background:var(--s)}
.colh .n{margin-left:auto;min-width:24px;height:20px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font-size:11.5px;background:#f1f3f7;color:var(--text);letter-spacing:0}
.lane{margin-top:10px;border-radius:14px}
.lh{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-radius:10px;transition:background .15s}
.lh:hover{background:rgba(15,23,42,.04)}
.lh .chev{color:var(--faint);transition:transform .25s}
.lane.closed .chev{transform:rotate(-90deg)}
.lh .di{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.lh .di .ico{width:15px;height:15px}
.lh b{font-size:14.5px;letter-spacing:-.01em}
.lh .cnt{font-size:12px;font-weight:650;color:var(--muted);background:#e9ecf2;border-radius:999px;padding:1px 8px}
.lh .mix{display:flex;height:6px;width:120px;border-radius:9px;overflow:hidden;background:#e9ecf2;margin-left:6px}
.lh .mix span{background:var(--s)}
.lh .sum{margin-left:auto;font-size:12.5px;color:var(--faint)}
.lb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:6px 0 4px;overflow:hidden;transition:opacity .2s}
.lane.closed .lb{display:none}
.cell{min-height:64px;border-radius:12px;background:color-mix(in srgb,var(--c) 4%,#eceef3);padding:6px;display:flex;flex-direction:column;gap:6px;border-left:3px solid color-mix(in srgb,var(--c) 70%,transparent)}
.cell:not(:first-child){border-left-color:transparent}
.cell.empty{background:transparent;border:1.5px dashed #e1e4ea}
.cell.empty:not(:first-child){border-left:1.5px dashed #e1e4ea}
.cell.empty:first-child{border-left:3px solid color-mix(in srgb,var(--c) 70%,transparent)}
.card{display:block;width:100%;background:#fff;border-radius:10px;padding:10px 10px 9px;border:1px solid rgba(15,23,42,.06);box-shadow:0 1px 2px rgba(15,23,42,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(15,23,42,.3);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.card.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.card .r1{display:flex;gap:10px;align-items:center}
.card .nm{display:block;font-weight:650;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rl{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tk{margin:9px 0 8px;font-size:12.5px;font-weight:550;color:var(--text);display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.card .tk .ico{width:13px;height:13px;margin-top:2px;color:var(--s)}
.card .pg{height:4px;border-radius:9px;background:#eef0f4;margin:-2px 0 9px;overflow:hidden}
.card .pg i{display:block;height:100%;background:var(--s);border-radius:inherit}
.card .ft{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.card .ft span:first-child{display:inline-flex;align-items:center;gap:4px}
.card .ft .ico{width:12px;height:12px}
.card.pl{background:rgba(255,255,255,.55);border:1.5px dashed #cdd3de;box-shadow:none;padding:6px 8px;display:flex;align-items:center;gap:9px}
.card.pl .r1{flex:1;min-width:0;gap:9px}.card.pl .av{width:24px;height:24px;border-radius:7px;font-size:9.5px}.card.pl .av .sd{display:none}
.card.pl .rl{display:none}.card.pl .nm{font-size:12.5px;font-weight:600;color:var(--muted)}.card.pl .ft span:first-child{display:none}
.card.pl:hover{background:#fff;border-style:solid}
.card.pl .av{filter:saturate(.35);opacity:.8}
.card.pl .tk{display:none}
.card.pl .ft{margin:0}
.none{display:none!important}
.emptymsg{text-align:center;padding:40px;color:var(--faint)}

/* ---- live additions ---- */
.nav nav a{text-decoration:none}
.nav nav a:not(.on):hover{color:#e2e8f0;background:rgba(255,255,255,.05)}
.live{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:650;color:#047857;background:#ecfdf5;border:1px solid #a7f3d0;white-space:nowrap;letter-spacing:.01em}
.live i{position:relative;width:7px;height:7px;border-radius:50%;background:#10b981}
.live i:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #10b981;opacity:0;animation:pulse 2s infinite}
.live span{color:#059669;font-weight:550;opacity:.85}
.live.load{color:var(--muted);background:#fff;border-color:var(--line)}.live.load i{background:var(--faint)}.live.load i:after{display:none}
button.live:hover{filter:brightness(.97)}
.notice{margin:14px 28px 0;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:13px}
.notice .ico{color:#d97706}
.notice b{font-weight:700}
.notice .sp{flex:1}
.retry{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px;background:#fff;border:1px solid #fcd34d;font-weight:650;font-size:12.5px;color:#92400e}
.retry:hover{background:#fef3c7}
.retry.spin .ico{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brief{margin:16px 28px 0;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:linear-gradient(110deg,#eef2ff,#faf5ff 55%,#fdf2f8);border:1px solid #e0e7ff;overflow:hidden}
.brief .bi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7)}
.brief .bh{min-width:0;flex:none;max-width:38%}
.brief small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7c3aed}
.brief b{display:block;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid #ddd6fe;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.brief li{font-size:12.5px;font-weight:550;color:#4c1d95;background:rgba(255,255,255,.75);border:1px solid #ede9fe;border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:#b91c1c;background:#fee2e2}
.tag.off{color:#475569;background:#e2e8f0}
.card .tk.muted{color:var(--faint);font-weight:500;font-style:italic}
.chief .sd{--card:#312e81}
.mstat{display:none}
.dr-note.live-n{color:#059669}
.dr-out{word-break:break-word;white-space:normal}
@media (max-width:1100px){.chief em{display:none}.lh .sum{display:none}}
@media (max-width:760px){
 .nav{padding:0 14px;gap:10px}.nav nav{margin-left:4px}.nav nav a{padding:6px 9px}
 .head{padding:16px 16px 0;flex-direction:column;align-items:stretch;gap:12px}
 h1{font-size:22px;flex-wrap:wrap;gap:8px}
 .chief{align-self:flex-start}
 .notice,.brief{margin-left:16px;margin-right:16px}
 .notice{flex-wrap:wrap}
 .brief{flex-direction:column;align-items:flex-start;gap:10px}
 .brief .bh{max-width:100%}.brief b{white-space:normal}
 .brief ul{border-left:0;padding:0}
 .bar-f{padding:10px 16px;flex-wrap:wrap;gap:8px}
 .srch{flex:1;width:auto;min-width:0}
 .bar-f .sp,.bar-f .sep{display:none}
 #dchips{order:5;width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
 #dchips::-webkit-scrollbar{display:none}
 #clear{display:none}
 .board{padding:10px 16px 32px}
 .cols{display:none}
 .mstat{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 6px}
 .mstat span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--muted);white-space:nowrap}
 .mstat i{width:7px;height:7px;border-radius:50%;background:var(--s)}
 .mstat em{font-style:normal;color:var(--text)}
 .lb{grid-template-columns:1fr;gap:8px}
 .cell{border-left:3px solid color-mix(in srgb,var(--c) 70%,transparent)!important}
 .cell.empty{display:none}
 .cell:before{content:attr(data-l);font-size:10.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 4px 0;display:flex;align-items:center;gap:6px}
 .drawer{width:100%}
 .lh .mix{width:70px}
}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></symbol>

<script>
"use strict";
const REPO="nalbhike/RIH-bot-status",RAW="https://raw.githubusercontent.com/"+REPO+"/",HEAD_API="https://api.github.com/repos/"+REPO+"/commits/main";
/* raw.githubusercontent ignores query strings and caches a branch path ~5 min, so we learn the newest commit SHA from the API
   (unauthenticated: 60 req/h per IP, so at most once a minute, ETag-conditional) and read files at that SHA (fresh + immutable). */
const REFRESH_MS=5000, HEAD_MS=60000, STALE_MS=24*3600e3;
const DEPTS=[
 {id:"Research",c:"#0ea5e9",i:"search",head:"Insight for every decision"},
 {id:"Knowledge",c:"#8b5cf6",i:"book",head:"Single source of truth"},
 {id:"Content & Brand",c:"#ec4899",i:"pen",head:"Content built from research"},
 {id:"Sales & Leads",c:"#f97316",i:"target",head:"Pipeline and outreach"},
 {id:"Operations",c:"#10b981",i:"gear",head:"Meetings, process and coordination"}];
const STATUSES=[
 {id:"idle",l:"Idle",c:"#f59e0b"},
 {id:"working",l:"Working",c:"#22c55e"},
 {id:"meeting",l:"In meeting",c:"#6366f1"},
 {id:"stale",l:"Offline / Stale",c:"#ef4444"},
 {id:"planned",l:"Planned",c:"#94a3b8"}];
const MAP={working:"working",idle:"idle",in_meeting:"meeting",offline:"stale",planned:"planned"};
const OCOL={Hike:"#8b5cf6",Igal:"#f97316",Rotem:"#0ea5e9"},PAL=["#14b8a6","#e11d48","#84cc16","#0891b2","#d946ef"];
const ocol=o=>OCOL[o]||PAL[[...String(o)].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
/* generic one-line roles (public page: keep generic) */
const ROLE={"grok-bot":"Coordinates every department","competitor-research":"Tracks the competitive landscape","new-verticals-scout":"Ranks candidate markets by fit","vertical-deep-dive":"Deep dive into one assigned market","prospect-research":"Background before meetings","tech-and-integrations-research":"Integration and tooling options","pricing-research":"Market pricing benchmarks","legal-and-compliance-research":"Compliance background","trends-research":"Weekly tools and trends digest","knowledge-base-librarian":"Keeps the knowledge base tidy","messaging-and-copy":"Website and sales copy","video-script-and-storyboard":"Explainer and ad scripts","social-content":"Social media posts","brand-and-design":"Brand and visual design","case-study":"Customer stories","job-ad-scanner":"Finds hiring signals","lead-list-builder":"Builds contact lists","outreach-drafter":"Drafts outreach","referral-tracker":"Tracks introductions","crm-and-follow-up":"Lead status and follow-ups","meeting-scribe":"Meeting notes and action items","meeting-and-follow-up":"Recaps and follow-ups","sales-playbook":"Meeting structure and checklists","scheduler":"Finds times and books meetings","project-coordinator":"Task board and weekly status"};
/* clearly-labelled placeholder roster, used only when GitHub can't be reached */
const SAMPLE=[
 ["grok-bot","Grok Bot","Chief of staff","working","Coordinating today's work",30],
 ["research-a","Research Bot A","Research","working","Collecting market notes",8],
 ["research-b","Research Bot B","Research","meeting","Weekly sync",3],
 ["research-c","Research Bot C","Research","idle","Finished a summary",95],
 ["research-d","Research Bot D","Research","stale","No recent update",3000],
 ["knowledge","Knowledge Bot","Knowledge","working","Filing new documents",2],
 ["content","Content Bot","Content & Brand","planned","Planned",null],
 ["sales","Sales Bot","Sales & Leads","planned","Planned",null],
 ["ops","Operations Bot","Operations","idle","No status yet",null]];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const ic=(n,c="ico")=>`<svg class="${c}"><use href="#i-${n}"/></svg>`;
const ini=n=>String(n).split(/[\s-]+/).filter(w=>w&&!/^(and|of|the|&)$/i.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
const mins=t=>t==null?null:Math.max(0,Math.floor((Date.now()-t)/60000));
const ago=t=>{const m=mins(t);return m==null?"—":m<1?"just now":m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
const longAgo=t=>{const m=mins(t);return m==null?"—":m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" days ago"};
const fmt=t=>t==null?"":new Date(t).toLocaleString("en-GB",{timeZone:"Asia/Jerusalem",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const DM=Object.fromEntries(DEPTS.map(d=>[d.id,d])),SM=Object.fromEntries(STATUSES.map(s=>[s.id,s]));
let BOTS=[],CHIEF=null,BY={},MODE="loading",lastSync=null,newest=null,loading=false;
let fDept=new Set(),fOwn=new Set(),q="",closed=new Set(),openSlug=null;

const col=b=>b.chief?"#6d28d9":(DM[b.d]||{c:"#64748b"}).c;
const av=(b,cls="av")=>`<span class="${cls}" style="--c:${col(b)}">${b.chief?ic("bot","ico av-ic"):esc(ini(b.n))}<i class="sd s-${b.s}" style="--s:${SM[b.s].c}"></i></span>`;
const owner=(o,short)=>o?`<span class="own${short?" sm":""}" style="--o:${ocol(o)}" title="Owner: ${esc(o)}"><b>${esc(o[0])}</b>${short?"":esc(o)}</span>`:"";
const pill=b=>`<span class="pill" style="--s:${SM[b.s].c}"><i></i>${b.s==="stale"?(b.off?"Offline":"Stale"):SM[b.s].l}</span>`;

function normalize(r,st,miss){
 const b={slug:r.slug,n:r.name||r.slug,d:r.department||"Operations",r:ROLE[r.slug]||"",o:null,s:"idle",t:"",u:null,out:null,miss:false,off:false,chief:r.slug==="grok-bot"||r.department==="Chief of staff"};
 if(r.state==="planned"){b.s="planned";b.t="Planned";return b}
 if(miss||!st){b.miss=true;b.t=miss==="err"?"Status unavailable":"No status yet";return b}
 b.n=st.bot||b.n;b.o=st.owner||null;b.t=String(st.task||"").trim()||"No task reported";b.out=st.last_output||null;
 const t=Date.parse(st.updated_at);b.u=isNaN(t)?null:t;
 let s=MAP[st.status]||"idle";
 if(s==="stale")b.off=true;
 if(s!=="planned"&&(b.u==null||Date.now()-b.u>STALE_MS))s="stale";
 b.s=s;return b}

let headSha=null,headEtag=null,headAt=0,headBlockUntil=0,RAWTXT={},lastBrief=0;
async function checkHead(force){
 const now=Date.now();if(now<headBlockUntil||(!force&&now-headAt<HEAD_MS)||(force&&now-headAt<15000))return;
 headAt=now;
 try{const r=await fetch(HEAD_API,{headers:headEtag?{"If-None-Match":headEtag,"Accept":"application/vnd.github+json"}:{"Accept":"application/vnd.github+json"},cache:"no-store"});
  if(r.status===304)return;
  if(r.status===403||r.status===429){const rs=+r.headers.get("x-ratelimit-reset");headBlockUntil=rs?rs*1000:now+15*60e3;return}
  if(!r.ok)return;
  const j=await r.json();if(j&&/^[0-9a-f]{40}$/.test(j.sha)){headSha=j.sha;headEtag=r.headers.get("etag")}
 }catch(e){}}
async function getJSON(path){
 /* pinned SHA URLs never change, so the browser cache can answer repeat polls; branch URLs bypass it */
 const ref=headSha||"main";
 const r=await fetch(RAW+ref+"/"+path,{cache:headSha?"force-cache":"no-store"});
 if(r.status===404)return {missing:true};
 if(!r.ok)throw new Error("HTTP "+r.status);
 const txt=await r.text();return {data:JSON.parse(txt),txt}}

async function load(force){
 if(loading)return;loading=true;$("#retry").classList.add("spin");
 try{
  await checkHead(force);
  const ro=await getJSON("bots.json");
  if(!ro.data||!Array.isArray(ro.data.bots))throw new Error("bad roster");
  const roster=ro.data.bots.filter(r=>r&&r.slug&&/^[a-z0-9-]+$/.test(r.slug));
  let fails=0,tried=0;
  const txt={"bots.json":ro.txt};
  const all=await Promise.all(roster.map(async r=>{
   if(r.state==="planned")return normalize(r);
   tried++;
   try{const x=await getJSON("status/"+r.slug+".json");
    let st=x.data,t=x.txt||"404";
    /* never step back to an older status (branch CDN copy can lag a pinned read) */
    const prev=BY[r.slug];if(st&&prev&&prev.u&&Date.parse(st.updated_at)<prev.u&&RAWTXT[r.slug]){t=RAWTXT[r.slug];st=JSON.parse(t==="404"?"null":t)}
    txt[r.slug]=t;return normalize(r,st,x.missing&&!st?"404":null)}
   catch(e){fails++;txt[r.slug]=RAWTXT[r.slug];return BY[r.slug]&&MODE==="live"?BY[r.slug]:normalize(r,null,"err")}}));
  if(tried&&fails===tried)throw new Error("status unreachable");
  const changed=MODE!=="live"||Object.keys(txt).length!==Object.keys(RAWTXT).length||Object.keys(txt).some(k=>txt[k]!==RAWTXT[k]);
  RAWTXT=txt;
  if(changed)apply(all,"live");else{MODE="live";lastSync=Date.now()}
 }catch(e){if(MODE!=="live"&&MODE!=="live-err")apply(sample(),"sample");else{MODE="live-err"}}
 finally{loading=false;$("#retry").classList.remove("spin");header()}
 if(force||Date.now()-lastBrief>HEAD_MS){lastBrief=Date.now();loadBrief()}
}
function sample(){return SAMPLE.map(([slug,n,d,s,t,m])=>({slug,n,d,r:d==="Chief of staff"?ROLE["grok-bot"]:"Placeholder bot",o:"Owner",s,t,u:m==null?null:Date.now()-m*60000,out:null,miss:t==="No status yet",off:false,chief:slug==="grok-bot"}))}
function apply(list,mode){
 MODE=mode;lastSync=Date.now();
 CHIEF=list.find(b=>b.chief)||{slug:"grok-bot",n:"Grok Bot",d:"Chief of staff",r:ROLE["grok-bot"],s:"idle",t:"No status yet",u:null,chief:true,miss:true};
 BOTS=list.filter(b=>!b.chief);BY=Object.fromEntries([CHIEF,...BOTS].map(b=>[b.slug,b]));
 const ts=list.map(b=>b.u).filter(Boolean);newest=ts.length?Math.max(...ts):null;
 render();if(openSlug&&BY[openSlug])openBot(openSlug,true)}

async function loadBrief(){
 const el=$("#brief");
 if(MODE==="sample"){el.classList.add("none");return}
 try{const x=await getJSON("daily/latest.json");const d=x.data;
  if(!d||(!d.headline&&!(d.items||[]).length)){el.classList.add("none");return}
  const items=(Array.isArray(d.items)?d.items:[]).filter(Boolean).slice(0,5);
  const dt=d.date&&!isNaN(Date.parse(d.date))?new Date(d.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}):esc(d.date||"");
  el.innerHTML=`<span class="bi">${ic("sun")}</span><div class="bh"><small>Daily briefing${dt?" · "+dt:""}</small><b title="${esc(d.headline)}">${esc(d.headline||"Today")}</b></div>${items.length?`<ul>${items.map(i=>`<li title="${esc(i)}">${esc(i)}</li>`).join("")}</ul>`:""}`;
  el.classList.remove("none");
 }catch(e){el.classList.add("none")}}

function header(){
 const s=$("#src");
 if(MODE==="live"||MODE==="live-err"){s.className="live";s.innerHTML=`<i></i>Live from GitHub<span>· updated ${newest?longAgo(newest):"—"} · refreshes every 5 s</span>`;
  s.title=(MODE==="live-err"?"Last refresh failed. ":"")+"Checked "+longAgo(lastSync)+". Click to refresh.";$("#notice").classList.add("none")}
 else if(MODE==="sample"){s.className="mock";s.textContent="Sample data";s.title="GitHub unreachable";$("#notice").classList.remove("none")}
 else{s.className="live load";s.innerHTML="<i></i>Connecting…"}}

const vis=b=>(!fDept.size||fDept.has(b.d))&&(!fOwn.size||fOwn.has(b.o))&&(!q||(b.n+" "+b.t+" "+b.r+" "+(b.o||"")).toLowerCase().includes(q));
function card(b){const s=SM[b.s],pl=b.s==="planned";
 const icn=b.s==="working"?"play":b.s==="meeting"?"cal":b.s==="stale"?"alert":"check";
 return `<button class="card${pl?" pl":""}${openSlug===b.slug?" sel":""}" data-bot="${esc(b.slug)}" style="--c:${col(b)};--s:${s.c}">
 <div class="r1">${av(b)}<div style="min-width:0"><span class="nm">${esc(b.n)}</span><span class="rl">${esc(b.r)}</span></div></div>
 <div class="tk${b.miss?" muted":""}">${ic(icn)}<span>${esc(b.t)}</span></div>
 <div class="ft"><span>${pl?"":b.s==="stale"?`<span class="tag${b.off?" off":""}">${b.off?"Offline":"Stale"}</span> ${b.u?ago(b.u):""}`:ic("clock")+ago(b.u)}</span>${owner(b.o,true)}</div></button>`}
function render(){
 const owners=[...new Set([CHIEF,...BOTS].map(b=>b.o).filter(Boolean))];
 [...fOwn].forEach(o=>owners.includes(o)||fOwn.delete(o));
 $("#fds").innerHTML=owners.map(o=>`<b style="background:${ocol(o)}" title="${esc(o)}">${esc(o[0])}</b>`).join("");
 $("#ownf").innerHTML=owners.length>1?owners.map(o=>`<button data-o="${esc(o)}" style="--o:${ocol(o)}" title="Owner: ${esc(o)}" class="${fOwn.has(o)?"on":""}">${esc(o[0])}</button>`).join(""):"";
 $("#ownf").nextElementSibling.style.display=owners.length>1?"":"none";
 $("#chief").dataset.bot=CHIEF.slug;
 $("#chief").innerHTML=`${av(CHIEF)}<div><small>Chief of staff</small><b>${esc(CHIEF.n)}</b></div><em>${esc(CHIEF.t)}</em>`;
 const V=BOTS.filter(vis);
 $("#colh").innerHTML=STATUSES.map(s=>`<div class="colh"><div style="--s:${s.c}"><i></i>${s.l}<span class="n">${V.filter(b=>b.s===s.id).length}</span></div></div>`).join("");
 $("#mstat").innerHTML=STATUSES.map(s=>`<span style="--s:${s.c}"><i></i>${s.l}<em>${V.filter(b=>b.s===s.id).length}</em></span>`).join("");
 const extra=[...new Set(BOTS.map(b=>b.d))].filter(d=>!DM[d]).map(d=>({id:d,c:"#64748b",i:"grid",head:""}));
 const ds=[...DEPTS,...extra].filter(d=>V.some(b=>b.d===d.id));
 $("#lanes").innerHTML=ds.length?ds.map(d=>{const L=V.filter(b=>b.d===d.id),act=L.filter(b=>b.s!=="planned").length;
  return `<section class="lane${closed.has(d.id)?" closed":""}" style="--c:${d.c}">
  <button class="lh" data-lane="${esc(d.id)}" aria-expanded="${!closed.has(d.id)}">${ic("chev","ico chev")}<span class="di">${ic(d.i)}</span><b>${esc(d.id)}</b><span class="cnt">${L.length}</span>
   <span class="mix">${STATUSES.map(s=>{const n=L.filter(b=>b.s===s.id).length;return n?`<span style="--s:${s.c};flex:${n}" title="${s.l}: ${n}"></span>`:""}).join("")}</span>
   <span class="sum">${act?act+" active":"All planned"}${d.head?" · "+esc(d.head):""}</span></button>
  <div class="lb">${STATUSES.map(s=>{const C=L.filter(b=>b.s===s.id);return `<div class="cell${C.length?"":" empty"}" data-l="${s.l}">${C.map(card).join("")}</div>`}).join("")}</div></section>`}).join(""):`<div class="emptymsg">No bots match these filters.</div>`;
 $("#dchips").innerHTML=DEPTS.map(d=>`<button class="dchip${fDept.has(d.id)?" on":""}" data-d="${esc(d.id)}" style="--c:${d.c}"><i></i>${esc(d.id)}</button>`).join("");
 $("#tog").lastChild.textContent=ds.length&&ds.every(d=>closed.has(d.id))?"Expand all":"Collapse all";
 header()}

function drawerHTML(b){const pl=b.s==="planned";
 return `<div class="dr-top" style="--c:${col(b)}"><button class="dr-x" data-close aria-label="Close">${ic("x")}</button>
  ${av(b,"av av-lg")}<div class="dr-id"><span class="dr-dept">${esc(b.d)}</span><h2>${esc(b.n)}</h2><p>${esc(b.r)}</p></div></div>
 <div class="dr-body">
  <div class="dr-row">${pill(b)}<span class="dr-upd">${ic("clock")}${pl?"Not started":b.u?"Updated "+ago(b.u):"No updates yet"}</span></div>
  <div class="dr-task"><span class="lbl">${pl?"Activation":"Current task"}</span><b>${esc(pl?"Planned for a later phase":b.t)}</b></div>
  <div class="dr-kv"><div><span class="lbl">Owner</span>${b.o?owner(b.o):`<span class="v">—</span>`}</div><div><span class="lbl">Reports to</span><span class="v">${b.chief?"Founders":"Grok Bot"}</span></div>
   ${b.u?`<div class="wide"><span class="lbl">Last update</span><span class="v">${esc(fmt(b.u))}</span></div>`:""}
   ${b.out?`<div class="wide"><span class="lbl">Latest output</span><span class="v mono dr-out">${ic("folder")}${esc(b.out)}</span></div>`:""}</div>
  <p class="dr-note${MODE==="sample"?"":" live-n"}">${MODE==="sample"?"Sample data · GitHub unreachable":"Live from GitHub · checked "+longAgo(lastSync)}</p>
 </div>`}
function openBot(slug,keep){const b=BY[slug];if(!b)return;openSlug=slug;$("#drawer").innerHTML=drawerHTML(b);document.body.classList.add("dr-open");
 $$("[data-bot]").forEach(e=>e.classList.toggle("sel",e.dataset.bot===slug));if(!keep)$("#drawer .dr-x").focus({preventScroll:true})}
function closeBot(){openSlug=null;document.body.classList.remove("dr-open");$$("[data-bot].sel").forEach(e=>e.classList.remove("sel"))}
document.addEventListener("click",e=>{if(e.target.closest("[data-close]")||e.target===$("#overlay")){closeBot();return}
 const c=e.target.closest("[data-bot]");if(c&&!e.target.closest(".drawer"))openBot(c.dataset.bot)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeBot()});
const tg=(set,k)=>{set.has(k)?set.delete(k):set.add(k);render()};
$("#dchips").onclick=e=>{const c=e.target.closest("[data-d]");c&&tg(fDept,c.dataset.d)};
$("#ownf").onclick=e=>{const c=e.target.closest("[data-o]");c&&tg(fOwn,c.dataset.o)};
$("#lanes").addEventListener("click",e=>{const h=e.target.closest("[data-lane]");h&&tg(closed,h.dataset.lane)});
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$("#clear").onclick=()=>{fDept.clear();fOwn.clear();q="";$("#q").value="";render()};
$("#tog").onclick=()=>{const ds=[...new Set(BOTS.map(b=>b.d))];if(ds.every(d=>closed.has(d)))closed.clear();else ds.forEach(d=>closed.add(d));render()};
$("#retry").onclick=()=>load(true);
$("#src").onclick=()=>load(true);
$(".logo span").innerHTML=ic("bot");
load(true);
/* poll every 5 s while the tab is visible; pause when hidden, refresh at once on return */
setInterval(()=>{if(!document.hidden)load()},REFRESH_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(true)});
window.addEventListener("focus",()=>load(true));
setInterval(()=>{if(BOTS.length&&!document.querySelector(".srch input:focus"))render()},30000);
</script></body></html>
