<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Virtual Office · Bot team</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f6f7fb;--surface:#fff;--surface-2:#f1f3f8;--border:rgba(15,23,42,.08);--border-2:rgba(15,23,42,.15);
  --text:#0f172a;--muted:#5b6578;--faint:#8792a6;--line:#cbd2de;
  --floor:#eef1f7;--tile:rgba(15,23,42,.045);--wood:#f3e6d3;--wood-2:#e3cfb2;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -14px rgba(15,23,42,.18);
  --shadow-lg:0 2px 4px rgba(15,23,42,.05),0 22px 48px -18px rgba(15,23,42,.3);
  --work:#10b981;--idle:#f59e0b;--meet:#6366f1;--plan:#94a3b8;--r:18px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --av:40px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0c11;--surface:#12151d;--surface-2:#191d27;--border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.16);
  --text:#e8eaf0;--muted:#a0a8b8;--faint:#7a8396;--line:#343b4a;
  --floor:#0e1118;--tile:rgba(255,255,255,.035);--wood:#2a2520;--wood-2:#3a3229;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 22px 48px -18px rgba(0,0,0,.85);
}}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,.desk:focus-visible{outline:3px solid color-mix(in srgb,var(--meet) 60%,transparent);outline-offset:2px}
.tl input:focus-visible~.tl-bar{outline:3px solid color-mix(in srgb,var(--meet) 60%,transparent);outline-offset:2px}
svg{display:block}
.wrap{max-width:1440px;margin:0 auto;padding:0 28px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tint{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.hero{position:relative;overflow:hidden;padding:34px 0 18px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.hero:before{width:520px;height:520px;left:-180px;top:-300px;background:radial-gradient(circle,#0ea5e9,transparent 70%);opacity:.42}
.hero:after{width:560px;height:560px;right:-220px;top:-280px;background:radial-gradient(circle,#ec4899,transparent 70%);opacity:.3}
.hero .wrap{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-size:13px;color:var(--muted);font-weight:550}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--idle);box-shadow:0 0 0 4px color-mix(in srgb,var(--idle) 22%,transparent)}
h1{font-size:clamp(32px,4.6vw,54px);line-height:1.03;letter-spacing:-.035em;margin:14px 0 0;font-weight:760}
h1 .grad{background:linear-gradient(100deg,#0ea5e9,#8b5cf6 45%,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;min-width:116px;display:flex;align-items:center;gap:12px;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat .sdot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 0 0 2.5px var(--c);flex:none}
.stat .sdot .ico{width:17px;height:17px}
.stat.plan .sdot{box-shadow:none;border:2px dashed var(--c)}
.stat .n{font-size:28px;font-weight:760;letter-spacing:-.04em;line-height:1;display:block}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;display:block;white-space:nowrap}
.stat.tot{padding:8px 14px 8px 8px}
.controls{position:sticky;top:0;z-index:40;padding:10px 0;backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border)}
.ctl1{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ctl2{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.seg button{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;font-size:13.5px;font-weight:650;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button .ico{width:17px;height:17px}
.seg button:hover{color:var(--text);background:var(--surface-2)}
.seg button.on{background:var(--c);color:#fff;box-shadow:0 6px 16px -8px var(--c)}
.player{flex:1;min-width:320px;display:flex;align-items:center;gap:12px;padding:6px 14px 6px 6px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.play{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);flex:none;box-shadow:0 8px 18px -8px #6366f1;transition:transform .2s}
.play:hover{transform:scale(1.06)}
.play .ico{width:18px;height:18px}
.clock{font:750 22px/1 var(--mono);letter-spacing:-.04em;min-width:92px;display:flex;flex-direction:column}
.clock small{font:650 11px/1.2 var(--font);color:var(--muted);letter-spacing:0;margin-top:3px;white-space:nowrap}
.tl{position:relative;flex:1;min-width:150px;padding:4px 0 16px}
.tl input{position:absolute;left:0;right:0;top:0;height:30px;width:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.tl-bar{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px}
.tl-bar i{display:grid;place-items:center;background:color-mix(in srgb,var(--c) 28%,var(--surface-2));color:color-mix(in srgb,var(--c) 75%,var(--text));min-width:0;transition:background .3s}
.tl-bar i.on{background:var(--c);color:#fff}
.tl-bar i .ico{width:13px;height:13px;stroke-width:2.2}
.tl-knob{position:absolute;top:0;width:4px;height:30px;border-radius:3px;background:var(--text);transform:translateX(-50%);pointer-events:none;box-shadow:0 0 0 3px var(--surface);transition:left .15s linear}
.tl-hrs{position:absolute;left:0;right:0;bottom:0;height:12px;font:600 9.5px/12px var(--mono);color:var(--faint)}
.tl-hrs span{position:absolute;transform:translateX(-50%)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:650;border:1px solid var(--border-2);color:var(--muted);background:var(--surface);transition:all .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--faint)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--c,var(--text));border-color:var(--c,var(--text));color:#fff}
.chip.on.neutral{color:var(--bg)}
.chip.on i{background:#fff}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:650;color:var(--muted);user-select:none;white-space:nowrap}
.switch .tr{width:40px;height:24px;border-radius:999px;background:var(--border-2);position:relative;transition:background .25s}
.switch .tr:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,.7,.3,1.3)}
.switch[aria-checked="true"]{color:var(--text)}
.switch[aria-checked="true"] .tr{background:var(--work)}
.switch[aria-checked="true"] .tr:after{transform:translateX(16px)}
main{padding:18px 0 10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.floor{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding:14px;border-radius:28px;
 background-color:var(--floor);background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);background-size:26px 26px;
 border:3px solid var(--border-2);box-shadow:var(--shadow);
 grid-template-areas:
 "fou fou fou std std std std std std war war war"
 "res res res res res res res res lib lib lib lib"
 "con con con con sal sal sal sal ops ops ops ops"
 "kit kit kit kit kit kit kit kit rec rec rec rec"}
.room{position:relative;min-width:0;border-radius:18px;padding:10px 12px 12px;background:color-mix(in srgb,var(--c) 7%,var(--surface));border:2.5px solid color-mix(in srgb,var(--c) 32%,var(--border-2));transition:opacity .35s,filter .35s,box-shadow .35s}
.room:after{content:"";position:absolute;bottom:-3px;left:50%;width:46px;height:4px;transform:translateX(-50%);background:var(--floor);border-radius:2px}
.room.dim{opacity:.32;filter:grayscale(.7)}
.room.hot{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.rh{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:28px}
.rh .ri{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.rh .ri .ico{width:16px;height:16px}
.rh b{font-size:13.5px;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .cnt{margin-left:auto;font-size:11px;font-weight:750;color:color-mix(in srgb,var(--c) 80%,var(--text));background:color-mix(in srgb,var(--c) 13%,transparent);padding:2px 8px;border-radius:999px;white-space:nowrap}
.z-fou{grid-area:fou}.z-std{grid-area:std}.z-war{grid-area:war}.z-res{grid-area:res}.z-lib{grid-area:lib}.z-con{grid-area:con}.z-sal{grid-area:sal}.z-ops{grid-area:ops}.z-kit{grid-area:kit}.z-rec{grid-area:rec}
.desks{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px 12px}
.desk{position:relative;height:112px;border-radius:14px;min-width:0;transition:opacity .3s;cursor:pointer}
.desk[hidden]{display:none}
.desk .tbl{position:absolute;left:6px;right:6px;top:4px;height:42px;border-radius:10px;background:linear-gradient(180deg,var(--wood),var(--wood-2));box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.desk .mon{position:absolute;left:50%;top:7px;width:46%;max-width:70px;height:8px;border-radius:4px;background:#334155;transform:translateX(-50%);transition:background .5s,box-shadow .5s}
.desk .kbd{position:absolute;left:50%;top:22px;width:26%;max-width:40px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--text) 18%,transparent);transform:translateX(-50%)}
.desk .mug{position:absolute;right:14%;top:22px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px #b45309}
.desk .chair{position:absolute;left:50%;top:44px;width:34px;height:34px;border-radius:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--c) 18%,var(--surface-2));border:2px solid color-mix(in srgb,var(--c) 30%,transparent)}
.desk .seat{position:absolute;left:50%;top:61px;width:2px;height:2px}
.desk .plate{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.desk.on .mon{background:color-mix(in srgb,var(--c) 75%,#fff);box-shadow:0 0 14px 3px color-mix(in srgb,var(--c) 55%,transparent),0 0 2px var(--c);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 22px 6px color-mix(in srgb,var(--c) 40%,transparent),0 0 2px var(--c)}}
.desk.planned{border:1.8px dashed color-mix(in srgb,var(--c) 45%,var(--border-2))}
.desk.planned .tbl{opacity:.45}
.desk.planned .chair{background:transparent;border:2px dashed color-mix(in srgb,var(--c) 40%,var(--border-2))}
.desk.planned .plate{color:var(--muted)}
.hire{position:absolute;left:50%;top:52px;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.02em;white-space:nowrap;padding:2px 7px;border-radius:999px;background:var(--surface);color:color-mix(in srgb,var(--c) 80%,var(--text));border:1px dashed var(--c)}
.ghost{border:1.8px dashed var(--border-2);border-radius:14px;padding:22px 10px;text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;grid-column:1/-1}
.ghost[hidden]{display:none}
.ghost b{display:block;font-size:22px;color:var(--c);letter-spacing:-.03em}
.lib-in{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:12px;align-items:start}
.shelf{display:grid;gap:7px}
.shelf div{height:22px;border-radius:6px;background:var(--wood-2);display:flex;align-items:flex-end;gap:2px;padding:0 5px 3px;overflow:hidden}
.shelf div i{display:block;width:7px;border-radius:2px 2px 0 0;background:var(--b)}
.commit{grid-column:1/-1;border-radius:12px;background:#0f172a;color:#e2e8f0;padding:9px 11px;font:11px/1.55 var(--mono);transition:opacity .4s,transform .4s;min-height:100px;position:relative}
.commit .idle{color:#94a3b8;display:flex;align-items:center;gap:6px}
.commit .idle .ico{width:14px;height:14px}
.commit .ch{display:flex;align-items:center;gap:6px;color:#c4b5fd;font-weight:700}
.commit .ch .ico{width:14px;height:14px}
.commit .spin{width:11px;height:11px;border-radius:50%;border:2px solid #c4b5fd;border-top-color:transparent;animation:spin .8s linear infinite;margin-left:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.commit .ln{color:#86efac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .35s both}
.commit .pb{height:4px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.commit .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#22d3ee);transition:width .5s}
.stage{position:relative;height:var(--sh,220px)}
@media (max-width:640px){#stdStage{--sh:300px}}
.table{position:absolute;inset:var(--ti,24% 17%);border-radius:50%;background:linear-gradient(180deg,var(--wood),var(--wood-2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.07),0 8px 22px -12px rgba(0,0,0,.35);display:grid;place-items:center;text-align:center}
.slot{position:absolute;width:2px;height:2px}
.chairdot{position:absolute;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);background:color-mix(in srgb,var(--c) 14%,var(--surface-2));border:1.5px solid color-mix(in srgb,var(--c) 25%,transparent)}
.tlabel{font-size:10.5px;font-weight:750;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:0 10px;line-height:1.3}
.agenda{position:absolute;left:50%;top:50%;width:min(210px,62%);transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);padding:7px 9px;transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.3,1.35);z-index:3;border:1px solid var(--border)}
.s-standup .agenda{opacity:1;transform:translate(-50%,-50%) scale(1)}
.agenda h4{margin:0 0 3px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--meet);display:flex;align-items:center;gap:5px}
.agenda h4 .ico{width:12px;height:12px}
.agenda ol{margin:0;padding:0;list-style:none;display:grid;gap:1px}
.agenda li{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:var(--muted);padding:1px 4px;border-radius:6px;transition:background .3s,color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda li b{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:9px;background:var(--surface-2);flex:none}
.agenda li.on{background:color-mix(in srgb,var(--meet) 13%,transparent);color:var(--text)}
.agenda li.on b{background:var(--meet);color:#fff}
.agenda li.done b{background:var(--work);color:#fff}
.whiteboard{position:absolute;left:8%;right:8%;top:0;height:8px;border-radius:4px;background:var(--surface);border:1.5px solid var(--border-2)}
.rec-in{position:relative;height:150px}
.counter{position:absolute;left:14%;right:14%;top:8px;height:54px;border-radius:0 0 60px 60px;background:linear-gradient(180deg,#312e81,#6d28d9);box-shadow:0 10px 24px -12px #6d28d9}
.counter span{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.12em;color:#ddd6fe;white-space:nowrap}
.door{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1.5px solid var(--border-2);border-radius:10px 10px 0 0;padding:3px 12px;border-bottom:0;z-index:1}
.door .ico{width:14px;height:14px}
.mat{position:absolute;left:50%;bottom:16px;width:70px;height:14px;transform:translateX(-50%);border-radius:5px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--meet) 25%,transparent) 0 6px,transparent 6px 10px)}
.kit-in{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.deco{display:flex;gap:8px;align-items:flex-end;flex:none}
.lounge{flex:1 1 300px;position:relative;border-radius:14px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 8%,transparent) 0 10px,transparent 10px 20px);padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;min-height:112px;align-content:center}
.lounge .slot{position:relative;width:auto;height:50px}
.lounge .slot:before{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:color-mix(in srgb,var(--c) 12%,transparent)}
.steam path{animation:steam 2.2s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:.7s}.steam path:nth-child(3){animation-delay:1.4s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
.leaf{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
.people{position:absolute;inset:0;pointer-events:none;z-index:5}
.av{position:absolute;left:0;top:0;width:var(--av);height:var(--av);pointer-events:auto;border-radius:50%;transition:transform 1.15s cubic-bezier(.45,.05,.25,1),opacity .35s,filter .35s;will-change:transform;z-index:1}
.av.noanim{transition:none!important}
.av .face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;background:linear-gradient(135deg,hsl(var(--h) 85% 55%),hsl(calc(var(--h) + 35) 75% 38%));box-shadow:0 0 0 2.5px var(--surface),0 0 0 5px var(--sc,var(--plan)),0 6px 14px -6px rgba(0,0,0,.45);transition:box-shadow .5s}
.av.moving .face{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px) rotate(3deg)}}
.av .rb{position:absolute;right:-6px;bottom:-5px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--c);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.av .rb .ico{width:12px;height:12px;stroke-width:2.2}
.av .cup{position:absolute;left:-8px;bottom:-4px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--idle);color:#fff;transform:scale(0);transition:transform .35s cubic-bezier(.3,.8,.3,1.5) .9s}
.av .cup .ico{width:12px;height:12px;stroke-width:2.2}
.av.st-idle .cup{transform:scale(1)}
.av.st-working{--sc:var(--work)}.av.st-idle{--sc:var(--idle)}.av.st-meeting{--sc:var(--meet)}
.av.st-working .face:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--work);animation:ring 2.2s ease-out infinite}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}

 liveFeed();liveChrome()}
function liveFeed(){
 const rows=LIVE_IDS.map(id=>[id,LIVE[id]]).sort((a,b)=>((b[1]&&b[1].ts)||0)-((a[1]&&a[1].ts)||0));
 const col={working:"#10b981",idle:"#f59e0b",in_meeting:"#6366f1",offline:"#94a3b8",planned:"#94a3b8"};
 FEED.innerHTML=rows.map(([id,L])=>{const p=byId[id];
  if(!L||L.missing)return `<li class="fi">${feedAv(id)}<div class="fm"><b>${esc(p.name)}</b><p class="stale">No status file yet</p></div></li>`;
  const k=L.stale?"stale":(L.status||"unknown"),c=L.stale?"#94a3b8":(col[L.status]||"#94a3b8");
  const lbl=L.stale?"Stale":(L.status||"unknown").replace("_"," ");
  return `<li class="fi" data-k="${esc(k)}">${feedAv(id)}<div class="fm"><b>${esc(p.name)}</b><time datetime="${new Date(L.ts||0).toISOString()}" title="${esc(absT(L.ts))}">${esc(ago(L.ts))}</time><p><span class="tag" style="--c:${c}">${esc(lbl.charAt(0).toUpperCase()+lbl.slice(1))}</span>${L.task?esc(L.task):""}</p></div></li>`}).join("")}
function liveChrome(){
 const live=mode==="live";
 $("#badge").classList.toggle("is-live",live&&!!lastOk);$("#badge").classList.toggle("is-wait",live&&!lastOk);
 $("#badgeT").textContent=live?(lastOk?"Live from GitHub":"Connecting to GitHub…"):"Demo mode · simulated statuses";
 $("#lu").textContent=live&&lastOk?"Checked "+ago(lastOk)+" · refreshes every 60 s":"";
 const ft=$("#feedTag");ft.textContent=live?"Live from GitHub":"Sample data (demo)";ft.classList.toggle("live",live);
 $("#foot").innerHTML=live?`<span class="demo live">Live</span>Status files: github.com/nalbhike/RIH-bot-status (status/*.json), refreshed every 60 s. No update in 24 h shows as stale.`
  :`<span class="demo">Demo mode</span>Statuses are simulated. Switch to Live to read real status from GitHub.`;
 $$("#mtog button").forEach(b=>{const on=b.dataset.m===mode;b.classList.toggle("on",on);b.setAttribute("aria-pressed",String(on))});
 document.body.classList.toggle("is-live",live)}
function notice(t){$("#notice").hidden=!t;$("#noticeT").textContent=t||""}
function goLive(){
 if(fetching)return;fetching=true;
 fetchLive().then(()=>{fetching=false;if(mode==="live"||fellBack){fellBack=false;notice("");if(mode!=="live"){mode="live";setPlay(false)}applyLive()}})
  .catch(()=>{fetching=false;if(mode==="live"){fellBack=true;mode="demo";cur=null;setClock(clock);liveChrome();
   notice("Couldn't reach GitHub, so this is showing demo data. It retries every 60 s.")}})}
function setMode(m,manual){
 if(manual)fellBack=false;
 if(m==="live"){mode="live";setPlay(false);notice("");liveChrome();if(lastOk&&Date.now()-lastOk<POLL_MS)applyLive();goLive()}
 else{mode="demo";cur=null;liveChrome();setClock(clock)}}
$("#mtog").addEventListener("click",e=>{const b=e.target.closest("button[data-m]");if(b&&b.dataset.m!==mode)setMode(b.dataset.m,true)});
$("#retry").addEventListener("click",()=>setMode("live",true));
pollT=setInterval(()=>{if(mode==="live"||fellBack)goLive()},POLL_MS);

/* ---------- init: everyone walks in from the entrance ---------- */
commitIdle();
const door=FLOOR.querySelector('[data-loc="door"]');
PEOPLE.forEach(p=>moveTo(AV[p.id],door,true));
const q=new URLSearchParams(location.search);
requestAnimationFrame(()=>requestAnimationFrame(()=>{const demo=q.get("mode")==="demo"||q.has("t")||q.has("play");
 if(demo){mode="demo";liveChrome();setClock(q.has("t")?+q.get("t"):600);if(q.has("play"))setPlay(true)}else setMode("live",true)}));
</script>
</body>
